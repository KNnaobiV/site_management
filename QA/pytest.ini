[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --headed=false --slowmo=0 --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure -v
markers =
    auth: authentication tests
    projects: project related tests
    plots: plot related tests
    works: work related tests
    jobs: job related tests
    invitations: invitation tests
    reports: report tests
    finance: finance and budget tests
    notifications: notification tests
    reports_export: reports export tests
    regression: full regression tests
