name: Build and Deploy
on:
  push:
    branches: [main]

env: 
  REGISTRY:: ghcr.io
  IMAGE_BACKEND: site_management_backend
  IMAGE_FRONTEND: site_management_frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Login to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Backend
      uses: docker/build-push-action@v6
      with:
        context: ./constropal
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/site_management_backend:latest
    
    - name: Build frontend
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/site_management_frontend:latest
        build-args: |
          VITE_API_URL=${{ secretes.VITE_API_URL }}
      
    - name: Deploy
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          cd /home/app && git pull origin main
          cd infra
          docker compose pull
          docker compose up -d
          docker image prune -f