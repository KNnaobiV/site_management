name: Build and Deploy
on:
  push:
    branches: [dev]

env: 
  REGISTRY:: ghcr.io
  IMAGE_BACKEND: site_management_backend
  IMAGE_FRONTEND: site_management_frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Login to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

    - name: Build Backend
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        push: true
        tags: ghcr.io/constuction/site_management_backend:latest
    
    - name: Build frontend
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        push: true
        tags: ghcr.io/constuction/site_management_frontend:latest
        build-args: |
          VITE_API_URL=${{ secrets.VITE_API_URL }}

    - name: Generate env file
      env:
        FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        BACKEND_URL: ${{ vars.BACKEND_URL }}
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_ADMIN_URL:  ${{ vars.DJANGO_ADMIN_URL }}
        ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
        CORS_ALLOWED_ORIGINS:  ${{ secrets.CORS_ALLOWED_ORIGINS }}
        CSRF_TRUSTED_ORIGINS:  ${{ secrets.CSRF_TRUSTED_ORIGINS }}
        EMAIL_HOST:  ${{ secrets.EMAIL_HOST }}
        EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
        EMAIL_USE_SSL:  ${{ secrets.EMAIL_USE_SSL }}
        EMAIL_USE_TLS:  ${{ secrets.EMAIL_USE_TLS }}
        EMAIL_HOST_USER:  ${{ secrets.EMAIL_HOST_USER }}
        EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        DEFAULT_FROM_EMAIL:  ${{ secrets.DEFAULT_FROM_EMAIL }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB}}
        POSTGRES_HOST:  ${{ secrets.POSTGRES_HOST }}
        POSTGRES_PASSWORD:  ${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_PORT: ${{ secrets.POSTGRES_PORT}}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      
      run: |
        mkdir -p output
        envsubst < backend/env/prod.env > output/prod.env

    - name: Deploy
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          cd /home/app && git pull origin main
          cd infra
          docker compose pull
          docker compose up -d
          docker image prune -f