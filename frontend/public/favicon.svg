<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1715"/>
      <stop offset="100%" stop-color="#2a2522"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d96b3c"/>
      <stop offset="100%" stop-color="#b8501f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Sand accent corner -->
  <path d="M0 380 L512 380 L512 512 L0 512 Z" fill="#e8dcc8" opacity="0.06"/>
  <!-- Hard hat silhouette -->
  <g transform="translate(256 270)">
    <!-- Brim -->
    <rect x="-150" y="38" width="300" height="28" rx="14" fill="url(#rust)"/>
    <!-- Dome -->
    <path d="M -120 38 Q -120 -90 0 -90 Q 120 -90 120 38 Z" fill="url(#rust)"/>
    <!-- Crest ridge -->
    <rect x="-8" y="-90" width="16" height="128" fill="#8a3a14" opacity="0.55"/>
    <!-- Side vents -->
    <rect x="-95" y="-10" width="40" height="6" rx="3" fill="#8a3a14" opacity="0.6"/>
    <rect x="55" y="-10" width="40" height="6" rx="3" fill="#8a3a14" opacity="0.6"/>
  </g>
  <!-- Wordmark dot -->
  <circle cx="256" cy="430" r="6" fill="#e8dcc8"/>
</svg>
